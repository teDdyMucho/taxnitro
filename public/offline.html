<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Finance Therapy Group</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #3A3131;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 80px; height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #E8B923, #B5905B);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900;
      color: #3A3131;
      margin-bottom: 32px;
      box-shadow: 0 8px 32px rgba(232,185,35,0.3);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; max-width: 300px; }
    .icon {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 32px; height: 32px; fill: rgba(255,255,255,0.4); }
    button {
      margin-top: 32px;
      background: #E8B923;
      color: #3A3131;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="logo">FTG</div>
  <div class="icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 6l5.5 5.5L12 5l5.5 6.5L23 6" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 12v8M8 20h8" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Please check your network and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
